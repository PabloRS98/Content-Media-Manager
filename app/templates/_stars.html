{# Macro: nota 1-10 mostrada como un sello circular (estilo estampilla de
   archivo), no estrellas -- coherente con la identidad "Archivo vintage". #}
{% macro stars(rating, size=15, show_number=true) %}
{%- if rating %}
<span class="rating-seal" style="--seal-size: {{ (size * 2.5)|round|int }}px" title="Nota: {{ rating }}/10">{% if show_number %}{{ rating }}{% endif %}</span>
{%- endif %}
{% endmacro %}
