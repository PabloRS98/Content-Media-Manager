name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lo que de verdad valida el comportamiento. Va primero y por separado porque
  # es lo más rápido: si la lógica está rota, no hace falta construir la imagen.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t media-catalog:ci .

      - name: Comprobar que el contenedor arranca y responde
        run: |
          docker run -d --name smoke -p 8000:8000 media-catalog:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/salud && break
            sleep 1
          done
          curl -sf http://localhost:8000/salud
          docker logs smoke
          docker stop smoke
