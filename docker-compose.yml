# Despliegue autónomo: esta app se levanta sola, sin depender de ninguna otra.
# Antes formaba parte de la suite "home-apps-suite" y arrancaba junto a
# finance-tracker; ahora cada aplicación tiene su propio ciclo de vida.
name: media-catalog

services:
  media-catalog:
    build: .
    container_name: media-catalog
    restart: unless-stopped
    ports:
      # Loopback por defecto: el catálogo (qué lees, qué ves, tus notas y
      # valoraciones) es información personal y la app permite borrarlo todo.
      # Publicarlo en 0.0.0.0 lo dejaba legible y modificable por cualquiera en
      # la red sin que nada lo indicara. Para llegar desde otra máquina, pon
      # MEDIA_BIND en el .env: a 0.0.0.0 si delante hay un proxy inverso o una
      # VPN, o directamente a la IP de la interfaz por la que quieras servir.
      - "${MEDIA_BIND:-127.0.0.1}:${MEDIA_PORT:-8002}:8000"
    env_file:
      # required: false porque el README presenta "cp .env.example .env" como
      # paso OPCIONAL (todas las claves tienen default). Sin esto, "docker
      # compose up" sin haber creado antes el .env abortaba con
      # "env file .env not found".
      - path: .env
        required: false
    volumes:
      - media_data:/data
    healthcheck:
      # La suite definía el healthcheck por fuera; al independizarse hay que
      # declararlo aquí o el contenedor pasaría a no tener ninguno.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  media_data:
    # Nombre fijado a propósito: sin esto Compose lo prefija con el nombre del
    # proyecto, y renombrar la carpeta apuntaría a un volumen vacío, con la
    # base de datos aparentemente "desaparecida".
    name: media-catalog_data
