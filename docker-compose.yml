services:
  media-catalog:
    build: .
    container_name: media-catalog
    restart: unless-stopped
    ports:
      - "8002:8000"
    # `required: false` porque el README presenta crear .env como paso opcional:
    # sin esto, `docker compose up` aborta si el fichero no existe.
    env_file:
      - path: .env
        required: false
    volumes:
      - media_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  media_data:
